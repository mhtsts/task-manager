# Workflow triggers
name: CI/CD

# Push and PR events
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Minimal permissions
permissions:
  contents: read

# Application validation
jobs:
  validate:
    name: Validate application
    runs-on: [self-hosted, macOS, X64]

    # Prepare source and tools
    steps:
      # uses =  GitHub Action; checkout downloads current commit in runner
      - name: Checkout repository
        uses: actions/checkout@v5

      # setup-node activates Node.js for next npm-commands
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/task-service/package-lock.json
            services/notification-service/package-lock.json

      # Frontend checks
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run build

      # Backend checks
      - name: Build task service
        working-directory: services/task-service
        run: |
          npm ci
          npm run build

      - name: Build notification service
        working-directory: services/notification-service
        run: |
          npm ci
          npm run build

  # Docker image publishing
  publish:
    name: Build and publish Docker images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # needs задаёт порядок: publish стартует только после успешного validate
    needs: validate
    runs-on: [self-hosted, macOS, X64]

    # Docker authentication
    steps:
      # Снова скачиваем код: каждый job получает отдельную рабочую папку
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Подготавливает современный Docker builder с cache/buildx поддержкой
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Frontend image
      # metadata генерирует tags/labels, но image не собирает
      - name: Generate frontend Docker tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend
          flavor: latest=auto
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # build-push собирает Dockerfile и отправляет image в Docker Hub
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      # Task image
      - name: Generate task service Docker tags
        id: task-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-task-service
          flavor: latest=auto
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # build and publish task-service image
      - name: Build and push task service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/task-service
          push: true
          tags: ${{ steps.task-meta.outputs.tags }}
          labels: ${{ steps.task-meta.outputs.labels }}

      # Notification image
      # Отдельные metadata tags для notification-service
      - name: Generate notification service Docker tags
        id: notification-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-notification-service
          flavor: latest=auto
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Сборка и публикация notification-service image
      - name: Build and push notification service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification-service
          push: true
          tags: ${{ steps.notification-meta.outputs.tags }}
          labels: ${{ steps.notification-meta.outputs.labels }}

  # Compose deployment
  deploy:
    name: Deploy with Docker Compose
    # Deploy only after push to main or release tag
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # needs задаёт цепочку: validate -> publish -> deploy
    needs: publish
    runs-on: [self-hosted, macOS, X64]

    # Prepare deployment
    steps:
      # Каждый job заново получает repository на локальный Mac runner
      - name: Checkout repository
        uses: actions/checkout@v5

      # Select image version
      # main использует sha-tag, release tag v2.1.0 превращается в Docker tag 2.1.0
      - name: Select published image tag
        id: image-tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # Download images
      - name: Pull published images
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMPOSE_PROJECT_NAME: task-manager
        run: |
          docker compose config
          docker compose pull db task-service notification-service frontend

      # Replace containers
      # Останавливаем старые containers и запускаем скачанные images без rebuild
      - name: Start published images
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMPOSE_PROJECT_NAME: task-manager
        run: |
          docker compose -p mini-task-manager down --remove-orphans || true
          docker compose down --remove-orphans || true
          docker rm -f tasks-db task-service notification-service frontend 2>/dev/null || true
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      # Initialize database
      - name: Initialize database schema
        env:
          COMPOSE_PROJECT_NAME: task-manager
        run: |
          until docker compose exec -T db pg_isready -U postgres -d tasksdb; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          docker compose exec -T db psql -U postgres -d tasksdb \
            -v ON_ERROR_STOP=1 \
            -f /docker-entrypoint-initdb.d/1-init-tasks-table.sql

      # Verify deployment
      # CD считается успешным только если backend и frontend отвечают
      - name: Check application health
        env:
          COMPOSE_PROJECT_NAME: task-manager
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null && \
              curl --fail --silent http://localhost:3000/ > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for services (attempt $attempt/30)..."
            sleep 5
          done
          docker compose logs --no-color
          exit 1
