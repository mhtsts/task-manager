name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/task-service/package-lock.json
            services/notification-service/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run build

      - name: Build task service
        working-directory: services/task-service
        run: |
          npm ci
          npm run build

      - name: Build notification service
        working-directory: services/notification-service
        run: |
          npm ci
          npm run build

  publish:
    name: Build and publish Docker images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    # runs-on: ubuntu-latest #github default runner, but i have a self-hosted runner on my macbook, so i will use it to build docker images and push to dockerhub
    runs-on: [self-hosted, macOS, X64]  #self hosted runner on my work macbook. To work work with htis runner, i should keep active run.sh file from folder github-runner on my desktop. this note only for owner of this template project, not to miss

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate frontend Docker tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend
          flavor: latest=auto
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Generate task service Docker tags
        id: task-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-task-service
          flavor: latest=auto
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push task service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/task-service
          push: true
          tags: ${{ steps.task-meta.outputs.tags }}
          labels: ${{ steps.task-meta.outputs.labels }}

      - name: Generate notification service Docker tags
        id: notification-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-notification-service
          flavor: latest=auto
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push notification service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification-service
          push: true
          tags: ${{ steps.notification-meta.outputs.tags }}
          labels: ${{ steps.notification-meta.outputs.labels }}

  deploy:
    name: Deploy with Docker Compose
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select published image tag
        id: image-tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull published images
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose pull db task-service notification-service frontend

      - name: Start published images
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Check application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null && \
              curl --fail --silent http://localhost:3000/ > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for services (attempt $attempt/30)..."
            sleep 5
          done
          docker compose logs --no-color
          exit 1
