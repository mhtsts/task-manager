apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: task-manager
data:
  PORT: "8081"
  TASK_SERVICE_URL: "http://task-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: task-manager
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: task-manager
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: PORT
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: notification-service-config
                  key: TASK_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
