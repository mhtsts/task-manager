apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: task-manager
data:
  1-init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      title VARCHAR(255) NOT NULL,
      description TEXT,
      status VARCHAR(20) NOT NULL DEFAULT 'TODO',
      created_at TIMESTAMP NOT NULL DEFAULT NOW(),
      updated_at TIMESTAMP NOT NULL DEFAULT NOW()
    );
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: task-manager
type: Opaque
stringData:
  postgres-password: postgres
  postgres-user: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: task-manager
data:
  POSTGRES_DB: tasksdb
  POSTGRES_USER: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: task-manager
  labels:
    app: postgresql
spec:
  type: ClusterIP
  selector:
    app: postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: task-manager
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgresql-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-password
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "tasksdb"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "tasksdb"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: postgresql-data
          emptyDir: {}
        - name: init-sql
          configMap:
            name: postgres-init-sql
